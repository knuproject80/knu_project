# ─────────────────────────────────────────────────────────
# DB 접속 — 환경변수 우선, 콜론(:) 뒤는 로컬 개발용 기본값
# ─────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kioskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kiosk_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kiosk1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# SQL 로그 비활성화 — 운영 로그 폭주 방지 + 약간의 오버헤드 절감
# (개발 중 쿼리를 보고 싶으면 true 로 잠시 변경)
spring.jpa.show-sql=false

# 트랜잭션 밖 지연로딩 방지 + DB 커넥션 조기 반환 (메모리/커넥션 절약)
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────
# HikariCP 커넥션 풀 — 소형 컨테이너에 맞게 축소
#   각 커넥션은 메모리와 스레드를 소비하므로 작게 유지
# ─────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ─────────────────────────────────────────────────────────
# Tomcat 스레드 풀 축소 — 기본 200개는 키오스크 트래픽에 과함
#   스레드 수 = 메모리(스택) 사용량과 직결
# ─────────────────────────────────────────────────────────
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5

# ─────────────────────────────────────────────────────────
# Hibernate 배치 페치 — N+1 완화 (연관 엔티티 추가 시 효과)
# ─────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Railway가 주입하는 $PORT 사용, 없으면 8080
server.port=${PORT:8080}

# 세션 정리 스케줄러 설정 (기존 기본값 유지)
kiosk.session.session-max-timeout-sec=300
kiosk.session.cleanup-interval-sec=30
