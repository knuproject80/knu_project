# ─────────────────────────────────────────────────────────
# DB 접속 — 환경변수 우선, 콜론(:) 뒤는 로컬 개발용 기본값
#   배포(Railway): SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 를 주입
#   로컬: 환경변수 없으면 아래 기본값으로 동작 (기존과 동일)
# ─────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kioskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kiosk_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kiosk1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Railway가 주입하는 $PORT 사용, 없으면 8080
server.port=${PORT:8080}
